name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build draft release
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi

      - name: Run repository check
        run: bun run check

      - name: Build unsigned ARM64 DMG
        run: bun run dist:mac

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No DMG artifact was produced." >&2
            exit 1
          fi
          shasum -a 256 "${artifacts[@]}" > dist/SHA256SUMS.txt

      - name: Create or update draft GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${artifacts[@]}" \
              dist/SHA256SUMS.txt \
              --draft \
              --generate-notes \
              --title "Infeld Bot $GITHUB_REF_NAME"
          fi
