name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        shell: bash
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Validate release version
        id: release
        shell: bash
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
          grep -F "## [$package_version]" CHANGELOG.md
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"

      - name: Require deployed Universal Links support
        shell: bash
        run: |
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          join_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/join.headers" \
            --output "$verification_dir/join.html" --write-out '%{http_code}' \
            https://openbot.run/join)"
          test "$join_status" = "200"
          tr -d '\r' < "$verification_dir/join.headers" | grep -Eiq '^cache-control:.*no-store'
          association_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/association.headers" \
            --output "$verification_dir/association.json" --write-out '%{http_code}' \
            https://openbot.run/.well-known/apple-app-site-association)"
          test "$association_status" = "200"
          tr -d '\r' < "$verification_dir/association.headers" | grep -Eiq '^content-type: application/json'
          jq -e '.applinks.details == [{"appID":"ZTRDTUL87R.app.openbot.desktop","paths":["/join"]}]' \
            "$verification_dir/association.json" >/dev/null

  macos:
    name: Build signed macOS ARM64 release
    needs: validate
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Restore Whisper model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .openbot-build/whisper/model
          key: openbot-whisper-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-whisper.ts') }}
          restore-keys: |
            openbot-whisper-model-${{ runner.os }}-${{ runner.arch }}-

      - name: Require signing and notarization credentials
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID MAC_PROVISIONING_PROFILE; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing release secrets: ${missing[*]}" >&2
            echo "See docs/RELEASING.md before publishing a tag." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository check
        run: bun run check

      - name: Install and verify native runtimes
        run: |
          bun run install:codex-runtime
          bun run install:claude-runtime
          bun run install:grok-runtime
          bun run install:cloudflared
          bun run install:remote-desktop-runtime
          bun run verify:remote-desktop-runtime

      - name: Install Developer ID provisioning profile
        shell: bash
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          profile_path="$RUNNER_TEMP/OpenBot.provisionprofile"
          printf '%s' "$MAC_PROVISIONING_PROFILE" | /usr/bin/base64 -D > "$profile_path"
          security cms -D -i "$profile_path" >/dev/null
          echo "OPENBOT_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize ARM64 update artifacts
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          bun run voice:prepare
          bun run build
          bun x electron-builder --mac --arm64 --publish never \
            --config.mac.provisioningProfile="$OPENBOT_PROVISIONING_PROFILE"

      - name: Verify packaged application metadata and launch
        run: bun run verify:package

      - name: Verify application signature and notarization
        shell: bash
        run: |
          app_path="dist/mac-arm64/OpenBot.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          runtime_path="$app_path/Contents/Resources/remote-desktop-runtime/darwin/arm64"
          codesign --verify --deep --strict --verbose=2 "$runtime_path/Sunshine.app"
          codesign --verify --strict --verbose=2 "$runtime_path/web-server"
          codesign --verify --strict --verbose=2 "$runtime_path/streamer"
          test -f "$app_path/Contents/embedded.provisionprofile"
          codesign -d --entitlements :- "$app_path" > "$RUNNER_TEMP/openbot-entitlements.plist"
          test -s "$RUNNER_TEMP/openbot-entitlements.plist"
          plutil -lint "$RUNNER_TEMP/openbot-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains:0' \
            "$RUNNER_TEMP/openbot-entitlements.plist" | grep -Fx 'applinks:openbot.run'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' \
            "$RUNNER_TEMP/openbot-entitlements.plist" | grep -Fx 'ZTRDTUL87R'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' \
            "$RUNNER_TEMP/openbot-entitlements.plist" | grep -Fx 'true'
          plutil -extract NSUserActivityTypes.0 raw "$app_path/Contents/Info.plist" \
            | grep -Fx 'NSUserActivityTypeBrowsingWeb'
          plutil -extract ElectronTeamID raw "$app_path/Contents/Info.plist" | grep -Fx 'ZTRDTUL87R'
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify updater metadata
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          metadata=(dist/latest-mac.yml)
          if (( ${#dmgs[@]} != 1 || ${#zips[@]} != 1 || ${#metadata[@]} != 1 )); then
            echo "Expected one DMG, one ZIP, and latest-mac.yml." >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          grep -F "version: $RELEASE_VERSION" dist/latest-mac.yml
          grep -F '.zip' dist/latest-mac.yml

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          artifacts=(*.dmg *.zip)
          shasum -a 256 "${artifacts[@]}" > SHA256SUMS-macos.txt

      - name: Generate macOS release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/mac-arm64/OpenBot.app
          format: spdx-json
          output-file: dist/OpenBot-${{ env.RELEASE_VERSION }}-macos.spdx.json
          artifact-name: OpenBot-${{ env.RELEASE_VERSION }}-macOS-SBOM
          upload-artifact: false
          upload-release-assets: false

      - name: Attest macOS release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-macos.txt

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
            dist/*.spdx.json
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build unsigned Windows x64 release
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 35
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Restore Whisper model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .openbot-build/whisper/model
          key: openbot-whisper-model-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-whisper.ts') }}
          restore-keys: |
            openbot-whisper-model-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows checks
        run: bun run lint && bun run typecheck && bunx vitest run src/backend/cli.test.ts

      - name: Install and verify remote desktop runtime
        run: bun scripts/install-remote-desktop-runtime.ts win32 x64 && bun run verify:remote-desktop-runtime --windows

      - name: Build unsigned NSIS installer
        run: bun run dist:win

      - name: Verify packaged application metadata and launch
        run: bun run verify:package:win --require-update-metadata

      - name: Verify installer and updater metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path dist -File -Filter *.exe)
          if ($installers.Count -ne 1 -or -not (Test-Path dist/latest.yml)) {
            Write-Error "Expected one EXE installer and latest.yml."
          }
          $applicationSignature = Get-AuthenticodeSignature -LiteralPath dist/win-unpacked/OpenBot.exe
          if ($applicationSignature.Status -ne "NotSigned") {
            Write-Error "The unsigned application contract changed: $($applicationSignature.Status)."
          }
          $sourceBuiltRuntimeExecutables = @(
            "dist/win-unpacked/resources/remote-desktop-runtime/win32/x64/sunshine.exe",
            "dist/win-unpacked/resources/remote-desktop-runtime/win32/x64/web-server.exe",
            "dist/win-unpacked/resources/remote-desktop-runtime/win32/x64/streamer.exe"
          )
          $vendorRuntimeExecutables = @(
            "dist/win-unpacked/resources/cloudflared/win/x64/cloudflared.exe",
            "dist/win-unpacked/resources/codex/win/x64/bin/codex.exe",
            "dist/win-unpacked/resources/codex/win/x64/bin/codex-code-mode-host.exe",
            "dist/win-unpacked/resources/claude/win/x64/bin/claude.exe",
            "dist/win-unpacked/resources/grok/win/x64/bin/grok.exe"
          )
          foreach ($runtimeExecutable in $sourceBuiltRuntimeExecutables) {
            $runtimeSignature = Get-AuthenticodeSignature -LiteralPath $runtimeExecutable
            if ($runtimeSignature.Status -ne "NotSigned") {
              Write-Error "The source-built runtime signature contract changed for ${runtimeExecutable}: $($runtimeSignature.Status)."
            }
          }
          foreach ($runtimeExecutable in $vendorRuntimeExecutables) {
            $runtimeSignature = Get-AuthenticodeSignature -LiteralPath $runtimeExecutable
            if ($runtimeSignature.Status -ne "Valid") {
              Write-Error "The vendor runtime signature is not valid for ${runtimeExecutable}: $($runtimeSignature.Status)."
            }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne "NotSigned") {
            Write-Error "The unsigned installer contract changed: $($signature.Status)."
          }
          Select-String -Path dist/latest.yml -SimpleMatch "version: $env:RELEASE_VERSION"
          Select-String -Path dist/latest.yml -SimpleMatch ".exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path dist -File -Filter *.exe)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($installer[0].Name)" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt

      - name: Generate Windows release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/win-unpacked
          format: spdx-json
          output-file: dist/OpenBot-${{ env.RELEASE_VERSION }}-windows.spdx.json
          artifact-name: OpenBot-${{ env.RELEASE_VERSION }}-Windows-SBOM
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Windows release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-windows.txt

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.spdx.json
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-macos
          path: release-assets/macos

      - name: Download Windows release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-windows
          path: release-assets/windows

      - name: Generate combined checksums
        shell: bash
        run: |
          cat release-assets/macos/SHA256SUMS-macos.txt \
            release-assets/windows/SHA256SUMS-windows.txt \
            > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release-assets/macos/* release-assets/windows/* release-assets/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "${artifacts[@]}" \
              --generate-notes \
              --latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenBot $RELEASE_TAG"
          fi
