name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed macOS release
    runs-on: macos-14
    timeout-minutes: 45
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Require signing and notarization credentials
        shell: bash
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing release secrets: ${missing[*]}" >&2
            echo "See docs/RELEASING.md before publishing a tag." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
              exit 1
            fi
          fi
          grep -F "## [$package_version]" CHANGELOG.md
          echo "RELEASE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$package_version" >> "$GITHUB_ENV"

      - name: Run repository check
        run: bun run check

      - name: Build, sign, and notarize ARM64 update artifacts
        run: bun run dist:release

      - name: Verify packaged application metadata and launch
        run: bun run verify:package

      - name: Verify application signature and notarization
        shell: bash
        run: |
          app_path="dist/mac-arm64/OpenBot.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify updater metadata
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          metadata=(dist/latest-mac.yml)
          if (( ${#dmgs[@]} != 1 || ${#zips[@]} != 1 || ${#metadata[@]} != 1 )); then
            echo "Expected one DMG, one ZIP, and latest-mac.yml." >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          grep -F "version: $RELEASE_VERSION" dist/latest-mac.yml
          grep -F '.zip' dist/latest-mac.yml

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip)
          shasum -a 256 "${artifacts[@]}" > dist/SHA256SUMS.txt

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/mac-arm64/OpenBot.app
          format: spdx-json
          output-file: dist/OpenBot-${{ env.RELEASE_VERSION }}.spdx.json
          artifact-name: OpenBot-${{ env.RELEASE_VERSION }}-SBOM
          upload-release-assets: false

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip dist/latest-mac.yml dist/*.blockmap dist/*.spdx.json dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" \
              "${artifacts[@]}" \
              --generate-notes \
              --latest \
              --title "OpenBot $RELEASE_TAG"
          fi
