name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed macOS release
    runs-on: macos-14
    timeout-minutes: 45
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Require signing and notarization credentials
        shell: bash
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing release secrets: ${missing[*]}" >&2
            echo "See docs/RELEASING.md before publishing a tag." >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$package_version" != "$tag_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$package_version" >> "$GITHUB_ENV"

      - name: Run repository check
        run: bun run check

      - name: Build, sign, and notarize ARM64 update artifacts
        run: bun run dist:release

      - name: Verify application signature and notarization
        shell: bash
        run: |
          app_path="dist/mac-arm64/Openbot.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify updater metadata
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          metadata=(dist/latest-mac.yml)
          if (( ${#dmgs[@]} != 1 || ${#zips[@]} != 1 || ${#metadata[@]} != 1 )); then
            echo "Expected one DMG, one ZIP, and latest-mac.yml." >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          grep -F "version: $RELEASE_VERSION" dist/latest-mac.yml
          grep -F '.zip' dist/latest-mac.yml

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip)
          shasum -a 256 "${artifacts[@]}" > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" \
              "${artifacts[@]}" \
              --generate-notes \
              --latest \
              --title "Openbot $RELEASE_TAG"
          fi
