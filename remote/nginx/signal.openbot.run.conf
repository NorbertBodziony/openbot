map $http_upgrade $openbot_connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  listen [::]:80;
  server_name signal.openbot.run;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name signal.openbot.run;

  ssl_certificate /var/lib/docker/volumes/openbot-remote_acme-data/_data/certificates/signal.openbot.run.crt;
  ssl_certificate_key /var/lib/docker/volumes/openbot-remote_acme-data/_data/certificates/signal.openbot.run.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location = /metrics {
    return 404;
  }

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $openbot_connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }
}
