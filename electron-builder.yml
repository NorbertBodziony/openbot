appId: app.openbot.desktop
productName: OpenBot
protocols:
  - name: OpenBot invitations
    schemes:
      - openbot
asar: true
artifactName: ${productName}-${version}-${arch}.${ext}
electronUpdaterCompatibility: ">=2.16"
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: github
  owner: NorbertBodziony
  repo: openbot
files:
  - out/**/*
  - package.json
  - LICENSE
  - NOTICE
extraResources:
  - from: build/icon-production.png
    to: icons/icon-production.png
  - from: build/icon-dev.png
    to: icons/icon-dev.png
  - from: build/icon-preview.png
    to: icons/icon-preview.png
  - from: node_modules/electron/dist/LICENSE
    to: licenses/Electron-LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
directories:
  output: dist
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "12.0"
  notarize: true
  hardenedRuntime: true
  icon: build/icon-production.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  darkModeSupport: true
  extendInfo:
    ElectronTeamID: ZTRDTUL87R
    NSUserActivityTypes:
      - NSUserActivityTypeBrowsingWeb
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon-production.ico
  # Windows builds are intentionally unsigned until release signing is configured.
  signExecutable: false
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
dmg:
  title: ${productName} ${version}
  backgroundColor: "#0b0d0e"
  contents:
    - x: 145
      y: 180
    - x: 395
      y: 180
      type: link
      path: /Applications
